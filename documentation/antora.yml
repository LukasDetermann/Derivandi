name: Derivandi
version: ~
prerelease: true
asciidoc:
  attributes:
    nofooter:
    source-highlighter: rouge
nav:
  - modules/ROOT/nav.adoc
ext:
  collector:
    run:
      command:
        mvn -B -f documentation/ clean test &&
        XCOPY documentation\src\test\java\com\derivandi documentation\target\antora\com\derivandi\ /Y /S
    scan:
      dir: ./target/antora/com/derivandi
      files: '**/*'
      base: modules/ROOT/examples